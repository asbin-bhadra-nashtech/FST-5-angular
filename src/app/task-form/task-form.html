<div class="form-card">

  <h2>Add New Task</h2>

  <form (ngSubmit)="addTask()" #taskForm="ngForm">

    <div class="form-group">
      <label for="title">Task Title</label>

      <input
        id="title"
        type="text"
        name="title"
        [(ngModel)]="title"
        required
        minlength="3"
        #titleInput="ngModel"
        placeholder="Enter task title"
      />

      @if (titleInput.invalid && titleInput.touched) {
      <div class="error">
        @if (titleInput.errors?.['required']) {
        <span>Task title is required.</span>
        }

        @if (titleInput.errors?.['minlength']) {
        <span>Task title must be at least 3 characters.</span>
        }
      </div>
      }
    </div>

    <div class="form-group">
      <label for="priority">Priority</label>

      <select
        id="priority"
        name="priority"
        [(ngModel)]="priority">

        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>

      </select>
    </div>

    <div class="button-group">

      <button
        type="submit"
        [disabled]="taskForm.invalid">
        Add Task
      </button>

      <button
        type="button"
        class="clear-button"
        (click)="clearForm()">
        Clear Form
      </button>

    </div>

  </form>

</div>
