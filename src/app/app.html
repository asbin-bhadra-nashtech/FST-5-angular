<div class="container">

  <header class="header">
    <h1>Task Manager</h1>

    <p class="pending-count">
      Pending Tasks: {{ pendingTaskCount }}
    </p>
  </header>

  <main>

    <section class="form-section">
      <app-task-form (taskAdded)="addTask($event)"></app-task-form>
    </section>

    <section class="list-section">
      <app-task-list
        [tasks]="tasks"
        (taskToggled)="toggleTask($event)">
      </app-task-list>
    </section>

  </main>

</div>
